<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vous avez été "hacké" !</title>
  <style>
    body {
      background: #000;
      color: #f00;
      font-family: "Courier New", monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 0;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 1.5em;
      animation: flicker 1.2s infinite alternate;
      text-shadow: 0 0 20px red, 0 0 40px crimson;
    }

    @keyframes flicker {
      0% { opacity: 1; text-shadow: 0 0 15px red; }
      50% { opacity: 0.6; text-shadow: 0 0 30px crimson; }
      100% { opacity: 1; text-shadow: 0 0 20px red; }
    }

    img {
      width: 360px;
      max-width: 80%;
      margin-bottom: 2em;
      animation: glitch 2s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0, 0); }
      20% { transform: translate(2px, -2px); }
      40% { transform: translate(-2px, 2px); }
      60% { transform: translate(1px, 1px); }
      80% { transform: translate(-1px, -1px); }
      100% { transform: translate(0, 0); }
    }

    a.button {
      border: 3px solid #fff;
      color: #fff;
      padding: 20px 40px;
      text-decoration: none;
      border-radius: 10px;
      font-size: 1.6rem;
      opacity: 0;
      animation: fadein 2.5s forwards 2.5s;
      transition: background 0.3s, transform 0.2s;
    }

    a.button:hover {
      background: red;
      border-color: red;
      transform: scale(1.1);
    }

    @keyframes fadein {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Vous avez été hacké</h1>
  <img src="static/img/hacked_phone.png" alt="Hacked phone" />
  <a class="button" href="stolen.html">Voir les données dérobées</a>

  <audio autoplay>
    <source src="static/sounds/hack_alert.mp3" type="audio/mpeg">
  </audio>
</body>
</html>
